<!doctype html>
<html lang="en" data-theme="persona5dark">
  <head>
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'persona5light' && t !== 'persona5dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'persona5dark' : 'persona5light';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Antonio:wght@700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,900;1,900&display=swap"
    />
    <title>Persona 5 Okumura Kunikazu Timer Geometry Visualization</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
