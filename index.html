<!doctype html>
<html lang="en" data-theme="persona5dark">
  <head>
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'persona5light' && t !== 'persona5dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'persona5dark' : 'persona5light';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>persona-5-okumura-clock-math-visualization</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
